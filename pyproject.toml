[tool.poetry]
name = "qibochem-qse"
version = "0.0.1"
description = "Research Fork for QSE built upon Qibochem"
authors = ["The Qibo team", "Naythan Yeo"]
license = "Apache License 2.0"
readme = "README.md"
repository = "https://github.com/naythanyeo/qibochem/"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
packages = [{ include = "qibochem", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
qibo = "^0.3.2"
openfermion = "^1.7.1"
pyscf = "^2.12.0"
scipy = "^1.15.2"
numpy = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = ">=7.2.1"
pytest-cov = ">=4.0.0"
pytest-env = ">=0.8.1"
pylint = "^3.3.5"

[tool.poe.tasks]
test = "pytest"
lint = "pylint src --errors-only"
lint-warnings = "pylint src --exit-zero"

[tool.pylint.reports]
output-format = "colorized"

[tool.pytest.ini_options]
testpaths = ['tests/']
addopts = ['--cov=qibochem', '--cov-report=xml', '--cov-report=html']
